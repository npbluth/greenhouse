<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4faf6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Greenhouse">
<title>Greenhouse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231a8a5a'/%3E%3Cpath d='M16 25V13' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 15c0-4 3-6 7-6 0 4-3 6-7 6zM16 18c0-3-2-5-6-5 0 3 2 5 6 5z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Light, calm, generous spacing. One column; one clear next action per screen. */
:root{
  --ground:#f4faf6;--panel:#ffffff;--sunk:#e6f3eb;--ink:#15322a;--soft:#557267;--line:#d3e8dc;
  --leaf:#1a8a5a;--leaf-ink:#ffffff;--leaf-soft:#dff3e8;--sun:#ffc533;--sun-ink:#3a2a00;--petal:#ef4f7e;
  --good:#12804f;--good-soft:#e2f6ea;--bad:#c23b5f;--bad-soft:#fdeaf0;
  --shadow:0 1px 2px rgba(21,50,42,.06),0 6px 20px rgba(21,50,42,.06);
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Figtree",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;display:grid;gap:24px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.08;text-wrap:balance}
h2{font-size:22px;line-height:1.3;font-weight:700;text-wrap:balance}
h3{font-size:18px;font-weight:700}
a{color:var(--leaf)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--petal);outline-offset:3px;border-radius:10px}
.muted{color:var(--soft)}.small{font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;color:var(--leaf)}
.logo svg{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700}
.hero{display:grid;gap:12px}
.card{background:var(--panel);border-radius:22px;padding:22px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.btn{display:block;width:100%;background:var(--leaf);color:var(--leaf-ink);font-weight:700;font-size:17px;padding:15px 20px;border-radius:16px;min-height:54px;text-align:center;transition:transform .12s}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.link{color:var(--leaf);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row .btn{flex:1 1 140px;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.topicchip{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);border-radius:99px;padding:10px 16px;font-weight:600;font-size:15px;min-height:44px}
.topicchip:active{background:var(--sunk)}
/* Garden strip: one pot per question; a right first try blooms. */
.garden{display:flex;gap:4px;align-items:flex-end;flex:1 1 auto;min-width:0}
.pot{flex:1 1 0;max-width:30px;min-width:0}
.pot svg{width:100%;height:auto;display:block}
.garden.big{justify-content:center;flex-wrap:wrap;gap:6px;width:100%}
.garden.big .pot{flex:0 0 36px;max-width:36px}
.qtop{display:flex;align-items:center;gap:14px}
.qtop .link{flex:none}
.topicname{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);min-height:56px;font-size:17px;transition:box-shadow .15s,background .15s}
.option .mark{flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-size:15px;font-weight:800}
.option.pick{box-shadow:inset 0 0 0 3px var(--leaf);background:var(--leaf-soft)}
.option.right{box-shadow:inset 0 0 0 3px var(--good);background:var(--good-soft);font-weight:600}
.option.right .mark{background:var(--good);color:var(--panel);box-shadow:none}
.option.wrong{box-shadow:inset 0 0 0 3px var(--bad);background:var(--bad-soft)}
.option.wrong .mark{background:var(--bad);color:var(--panel);box-shadow:none}
.option.dim{opacity:.55}
input[type=text]{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--panel);min-height:56px;font-size:18px}
input[type=text]:focus{border-color:var(--leaf);outline:none}
.feedback{display:grid;gap:12px;border-radius:22px;padding:20px;background:var(--panel);box-shadow:var(--shadow)}
.feedback.yes{background:var(--good-soft);box-shadow:none}
.feedback.no{background:var(--bad-soft);box-shadow:none}
.verdict{font-family:var(--display);font-size:28px;line-height:1.1}
.feedback.yes .verdict{color:var(--good)}
.feedback.no .verdict{color:var(--bad)}
.source{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.score{font-family:var(--display);font-size:clamp(64px,22vw,96px);line-height:1;color:var(--leaf)}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.trow{display:grid;gap:6px}
.trow .row{justify-content:space-between}
.missed{display:grid;gap:8px;padding-top:16px;border-top:2px solid var(--line)}
.missed:first-of-type{border-top:0;padding-top:0}
.self{display:grid;gap:10px}
/* Test confidence ring */
.confrow{display:flex;gap:20px;align-items:center}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ringfill{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ringnum{position:absolute;inset:0;display:grid;place-content:center;grid-auto-flow:column;align-items:baseline;font-family:var(--display);color:var(--leaf)}
.ringnum b{font-weight:400;font-size:34px;line-height:1}
.ringnum small{font-size:18px;margin-left:1px}
@media (max-width:360px){.confrow{flex-direction:column;align-items:flex-start}}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
/* Test picker, definitions, matching */
.pickcard{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.pickcard:active{transform:scale(.99)}
.term{color:var(--leaf)}
.stimulus{margin:0;padding:14px 16px;border-left:4px solid var(--sun);background:var(--panel);border-radius:0 14px 14px 0;font-size:18px;line-height:1.5}
textarea{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--panel);font:inherit;font-size:18px;resize:vertical;min-height:96px}
textarea:focus{border-color:var(--leaf);outline:none}
.diff{font-size:18px;line-height:1.7;margin:0}
.diff ins{text-decoration:none;background:var(--sun);color:var(--sun-ink);font-weight:700;border-radius:6px;padding:0 4px}
.diff del{color:var(--bad);text-decoration-thickness:2px}
.diff .typo{text-decoration:underline wavy var(--sun);text-underline-offset:4px}
.termchip.on{background:var(--leaf);color:var(--leaf-ink);box-shadow:none}
.termchip.gone{opacity:.35;text-decoration:line-through}
.defopt{font-size:16px}
.notice{margin:0;background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  .shake{animation:shake .35s}
  .rise{animation:rise .3s ease-out}
  .bloom{animation:bloom .5s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 90%}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @keyframes bloom{from{transform:scale(.3)}to{transform:scale(1)}}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script src="sets/apwh-unit3.js?v=6"></script>

</body>
</html>
